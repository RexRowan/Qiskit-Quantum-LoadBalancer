[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-quantum-loadbalancer"
version = "0.1.0"
description = "Noise- and queue-aware backend selection and routing for IBM Quantum backends"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Rex Rowan" }
]
dependencies = [
    "qiskit>=2.0,<3",
    "qiskit-ibm-runtime>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/RexRowan/qiskit-quantum-loadbalancer"

[tool.setuptools.packages.find]
where = ["src"]
